<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>街コロ風ゲーム</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    .top-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .money {
      font-size: 20px;
      margin: 10px 0;
    }

    .card-area {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .card {
      width: 160px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      transition: 0.2s;
      color: white;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .blue {
      background: #4da6ff;
    }

    .green {
      background: #66cc66;
    }

    .red {
      background: #ff6666;
    }

    .landmark {
      background: #ffcc00;
      color: black;
    }

    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .owned-area {
      margin-top: 20px;
    }

    .small-card {
      display: inline-block;
      margin-right: 10px;
    }

    .highlight {
      outline: 4px solid yellow;
    }

    #rollButton {
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="roomSelect">
    <button id="createRoomBtn">新規ルーム作成</button>
    <button id="joinRoomBtn">既存ルーム参加</button>
  </div>

  <div id="createRoomArea" style="display:none;">
    <select id="playerCount">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
    </select>
    <button id="createBtn">ルーム作成</button>
  </div>

  <div id="joinRoomArea" style="display:none;">
    <input id="roomIdInput" placeholder="ルームID">
    <input id="playerNameInput" placeholder="名前">
    <button id="joinButton">参加</button>
  </div>

  <div id="waitingRoom" style="display:none;">
    <h2>ルームID: <span id="displayRoomId"></span></h2>
    <h3>参加者一覧</h3>
    <div id="playerList"></div>
  </div>

  <h1>街コロ風ゲーム（改良版）</h1>

  <div class="top-area">
    <h2>現在のプレイヤー: <span id="currentPlayer">1</span></h2>
    <h2 id="phaseDisplay">🎲 ダイスフェーズ</h2>
    <button id="rollButton">ダイスを振る</button>
    <p>ダイスの目: <span id="diceResult">-</span></p>
    <div class="money">💰 所持金: <span id="moneyResult">3</span></div>
  </div>

  <div class="owned-area">
    <h3>所持建物</h3>
    <div id="ownedBuildings"></div>

    <h3>ランドマーク</h3>
    <div id="ownedLandmarks"></div>
  </div>

  <hr>

  <h2>🛒 建物購入</h2>
  <div class="card-area" id="buildingCards"></div>

  <!-- ★追加 -->
  <div class="card-area">
    <div class="card" id="skipCard" style="background:#999;">
      <h3>⏭ 何も買わない</h3>
      <p>ターン終了</p>
    </div>
  </div>

  <h2>🏰 ランドマーク</h2>
  <div class="card-area" id="landmarkCards"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>

</body>

</html>
