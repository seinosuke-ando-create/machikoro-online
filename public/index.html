<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dice Game</title>
</head>
<body>

<h1>Dice Game</h1>

<!-- 🔹 スタート画面 -->
<div id="startScreen">
  <h2>ルーム選択</h2>

  <div>
    <h3>新規ルーム作成</h3>
    <input id="createName" placeholder="あなたの名前">
    <select id="maxPlayers">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
    </select>
    <button onclick="createRoom()">作成</button>
  </div>

  <hr>

  <div>
    <h3>既存ルームに参加</h3>
    <input id="joinName" placeholder="あなたの名前">
    <input id="roomIdInput" placeholder="ルームID">
    <button onclick="joinRoom()">参加</button>
  </div>
</div>

<!-- 🔹 ロビー -->
<div id="lobbyScreen" style="display:none;">
  <h2>ルームID: <span id="roomIdDisplay"></span></h2>
  <h3>参加者</h3>
  <ul id="playerList"></ul>
</div>

<!-- 🔹 ゲーム画面 -->
<div id="gameScreen" style="display:none;">

  <h2 id="phaseDisplay"></h2>

  <button onclick="rollDice()">ダイスを振る</button>
  <button onclick="endTurn()">ターン終了</button>

  <h3>建物購入</h3>
  <button onclick="buyBuilding('wheatField')">麦畑</button>
  <button onclick="buyBuilding('ranch')">牧場</button>
  <button onclick="buyBuilding('forest')">森</button>
  <button onclick="buyBuilding('bakery')">パン屋</button>
  <button onclick="buyBuilding('convenienceStore')">コンビニ</button>
  <button onclick="buyBuilding('cafe')">カフェ</button>

  <h3>プレイヤー情報</h3>
  <div id="players"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
